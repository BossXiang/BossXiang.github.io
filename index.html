const { useState, useEffect, useRef, useCallback } = React;

function useReveal(){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ el.classList.add('in'); io.unobserve(el); }
      });
    }, {threshold:.15, rootMargin:'0px 0px -10% 0px'});
    io.observe(el);
    return ()=> io.disconnect();
  },[]);
  return ref;
}

function Reveal({as:Tag='div', delay=0, children, className='', style={}}){
  const ref = useReveal();
  return <Tag ref={ref} className={`reveal ${className}`} style={{transitionDelay:`${delay}ms`, ...style}}>{children}</Tag>;
}

    </div>

}

function useDampedMouse(damp=0.08){
  const target = useRef({x:0,y:0});
  const current = useRef({x:0,y:0});
  useEffect(()=>{
    const onMove = (e)=>{
      const w = window.innerWidth, h = window.innerHeight;
      target.current = { x:(e.clientX/w)*2-1, y:(e.clientY/h)*2-1 };
    };
    window.addEventListener('mousemove', onMove);
    let raf;
    const tick=()=>{
      current.current.x += (target.current.x - current.current.x)*damp;
      current.current.y += (target.current.y - current.current.y)*damp;
      raf = requestAnimationFrame(tick);
    };
    tick();
    return ()=>{ window.removeEventListener('mousemove', onMove); cancelAnimationFrame(raf); };
  },[damp]);
  return current;
}

function Magnetic({children, strength=0.25, style={}}){
  const ref = useRef(null);
  const [t, setT] = useState({x:0,y:0});
  const onMove = (e)=>{
    const r = ref.current.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    setT({x:(e.clientX-cx)*strength, y:(e.clientY-cy)*strength});
  };
  return (
    <div ref={ref}
      onMouseMove={onMove}
      onMouseLeave={()=>setT({x:0,y:0})}
      onMouseEnter={()=>document.body.dataset.cursor='hover'}
      style={{transform:`translate3d(${t.x}px, ${t.y}px, 0)`, transition:'transform .25s cubic-bezier(.2,.8,.2,1)', ...style}}>
      {children}
    </div>
  );
}

// ============== HERO ==============
function FloatingPanel({depth=20, x=0, y=0, w=220, h=140, delay=0, children, accent=false, rot=0}){
  const ref = useRef(null);
  const dampedMouse = useDampedMouse(0.07);
  useEffect(()=>{
    let raf;
    const tick = ()=>{
      const m = dampedMouse.current;
      const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--parallax')) || 1;
      if(ref.current){
        const tx = -m.x * depth * k;
        const ty = -m.y * depth * k;
        const rx = m.y * 8 * k;
        const ry = -m.x * 12 * k;
        ref.current.style.transform = `translate3d(${x + tx}px, ${y + ty}px, 0) rotateX(${rx}deg) rotateY(${ry + rot}deg)`;
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return ()=> cancelAnimationFrame(raf);
  },[depth, x, y, rot]);
  return (
    <div ref={ref} className={`glass ${accent?'lit':''}`} style={{
      position:'absolute', width: w, height: h, padding: 14,
      transformStyle:'preserve-3d',
      transition: `opacity .8s ease ${delay}ms, filter .8s ease ${delay}ms`,
      animation: `floaty ${6 + (depth%5)}s ease-in-out ${delay}ms infinite alternate`,
    }}>{children}</div>
  );
}

function MiniGraph(){
  const pts = [];
  const N=24;
  for(let i=0;i<N;i++){
    const v = 30 + Math.sin(i*0.6)*8 + Math.cos(i*1.1)*5 + i*0.6;
    pts.push([i*(190/(N-1))+5, 70-v*0.7]);
  }
  const d = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return (
    <svg width="200" height="80" viewBox="0 0 200 80">
      <path d={d} fill="none" stroke="#5BC0BE" strokeWidth="1.5"/>
      <path d={d+' L195 75 L5 75 Z'} fill="rgba(91,192,190,.12)"/>
      {pts.map((p,i)=> i%4===0 && <circle key={i} cx={p[0]} cy={p[1]} r="1.6" fill="#5BC0BE"/>)}
    </svg>
  );
}

function Hero(){

      raf = requestAnimationFrame(tick);

    tick();
    return ()=>cancelAnimationFrame(raf);

  const [time, setTime] = useState(()=> new Date());
  useEffect(()=>{
    const id = setInterval(()=>setTime(new Date()), 1000);
    return ()=>clearInterval(id);
  },[]);
  const tStr = time.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone:'Asia/Taipei'});

  return (

function LanguageBar({l, delay}){
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(()=>{
    const io = new IntersectionObserver(([e])=>{
      if(e.isIntersecting){ setTimeout(()=> setW(l.pct), delay); io.disconnect(); }
    },{threshold:.4});
    if(ref.current) io.observe(ref.current);
    return ()=> io.disconnect();
  },[delay,l.pct]);
  return (
    <div ref={ref}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:6}}>
        <span style={{fontSize:16, fontWeight:500}}>{l.name}</span>
        <span className="mono" style={{fontSize:11, color:'rgba(255,255,255,.55)'}}>{l.level}</span>

      </div>
    </div>
  );
}

function DraggableProjectCard({p, start, onOpen, zCounter, setZCounter, delay}){
  const [pos, setPos] = useState({x:start.x, y:start.y, r:start.r});
  const [z, setZ] = useState(1);
  const [dragging, setDragging] = useState(false);
  const downRef = useRef(null);
  const ref = useRef(null);

  const onPointerDown = (e)=>{
    if(e.button===2) return;
    const r = ref.current.getBoundingClientRect();
    downRef.current = {sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y, moved: false};
    setZCounter(c=>c+1);
    setZ(zCounter+1);
    setDragging(true);
    ref.current.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e)=>{
    if(!downRef.current) return;
    const dx = e.clientX - downRef.current.sx;
    const dy = e.clientY - downRef.current.sy;
    if(Math.abs(dx)+Math.abs(dy) > 4) downRef.current.moved = true;
    setPos({x: downRef.current.ox + dx, y: downRef.current.oy + dy, r: start.r + (dx*0.02)});
  };
  const onPointerUp = ()=>{
    const moved = downRef.current?.moved;
    downRef.current = null;
    setDragging(false);
    setPos(p=>({...p, r:start.r}));
    if(!moved) onOpen();
  };

  return (
    <div ref={ref} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={()=>{downRef.current=null; setDragging(false);}} onMouseEnter={()=>document.body.dataset.cursor='hover'} onMouseLeave={()=>document.body.dataset.cursor=''}
      style={{position:'absolute', left: 0, top: 0, transform: `translate3d(${pos.x}px, ${pos.y}px, 0) rotate(${pos.r}deg) scale(${dragging?1.03:1})`, transition: dragging ? 'transform .04s linear' : `transform .35s cubic-bezier(.2,.8,.2,1) ${delay}ms, box-shadow .3s`, width: 420, zIndex: z, cursor: dragging?'grabbing':'grab', touchAction:'none'}}>
      <ProjectCard p={p} dragging={dragging}/>
    </div>
  );
}

function Stat({label, value, accent=false}){

function TargetingGame(){
  const fieldRef = useRef(null);
  const [running, setRunning] = useState(false);
  const [score, setScore] = useState(0);
  const [time, setTime] = useState(30);
  const [target, setTarget] = useState({x:50, y:50, id:0});
  const [best, setBest] = useState(()=> Number(localStorage.getItem('tom-best')||0));
  const [pings, setPings] = useState([]);
  const [acquiring, setAcquiring] = useState(false);
  const acquireTimer = useRef(null);

  useEffect(()=>{
    if(!running) return;
    if(time<=0){ setRunning(false); if(score>best){ setBest(score); localStorage.setItem('tom-best', String(score)); } return; }
    const id = setTimeout(()=> setTime(t=>t-1), 1000);
    return ()=> clearTimeout(id);
  },[running, time, score, best]);

  useEffect(()=>{
    if(!running) return;
    const id = setInterval(()=>{ setTarget(prev=> ({ x: 8 + Math.random()*84, y: 12 + Math.random()*76, id: prev.id+1 })); setAcquiring(false); }, 1800);
    return ()=> clearInterval(id);
  },[running]);

  const start = ()=>{ setScore(0); setTime(30); setTarget({x:50,y:50,id:0}); setRunning(true); };

  const onFieldMove = (e)=>{
    const r = fieldRef.current.getBoundingClientRect();
    const x = ((e.clientX - r.left)/r.width)*100;
    const y = ((e.clientY - r.top)/r.height)*100;
    if(!running) return;
    const dx = x - target.x, dy = y - target.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 5){
      if(!acquiring){
        setAcquiring(true);
        acquireTimer.current = setTimeout(()=>{
          setScore(s=>s+1);
          setPings(p=> [...p, {id:Date.now(), x:target.x, y:target.y}].slice(-6));
          setTarget(prev=> ({ x: 8 + Math.random()*84, y: 12 + Math.random()*76, id: prev.id+1 }));
          setAcquiring(false);
        }, 350);
      }
    } else { if(acquiring){ clearTimeout(acquireTimer.current); setAcquiring(false); } }
  };

  const onLeave = ()=>{ if(acquireTimer.current){ clearTimeout(acquireTimer.current); } setAcquiring(false); };

  useEffect(()=>{
    if(!pings.length) return;
    const id = setTimeout(()=> setPings(p=>p.slice(1)), 800);
    return ()=> clearTimeout(id);
  },[pings]);

  return (
    <div className="glass lit" style={{padding:20, borderRadius:20}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:12}}>
        <div className="mono" style={{fontSize:11, color:'#5BC0BE', letterSpacing:'.18em', textTransform:'uppercase'}}>ACCUTRACK · TRAINING SIM</div>
        <div style={{display:'flex', gap:18, alignItems:'center'}}>
          <Stat label="SCORE" value={score}/><Stat label="TIME" value={`${time}s`}/><Stat label="BEST" value={best} accent/>
          <button onClick={start} disabled={running} style={{background: running ? 'rgba(255,255,255,.04)' : '#5BC0BE', color: running ? 'rgba(255,255,255,.4)' : '#0B132B', border:0, borderRadius:999, padding:'8px 14px', fontFamily:'JetBrains Mono', fontSize:11, fontWeight:600, letterSpacing:'.12em', textTransform:'uppercase', cursor:'inherit'}}>{running ? 'tracking…' : (time<=0 ? 'restart' : 'start')}</button>
        </div>
      </div>
      <div ref={fieldRef} onMouseMove={onFieldMove} onMouseLeave={onLeave} style={{position:'relative', height:380, borderRadius:14, background:'radial-gradient(600px 240px at 30% 20%, rgba(91,192,190,.07), transparent 70%),linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.45))', border:'1px solid rgba(91,192,190,.2)', backgroundImage:'linear-gradient(rgba(91,192,190,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(91,192,190,.08) 1px, transparent 1px),radial-gradient(600px 240px at 30% 20%, rgba(91,192,190,.07), transparent 70%),linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.45))', backgroundSize:'40px 40px, 40px 40px, auto, auto', overflow:'hidden', cursor:'crosshair'}}>
        {[{top:8, left:8, rot:0},{top:8, right:8, rot:90},{bottom:8, right:8, rot:180},{bottom:8, left:8, rot:270}].map((c,i)=>(<svg key={i} width="22" height="22" style={{position:'absolute', ...c, transform:`rotate(${c.rot}deg)`}}><path d="M2 10 V2 H10" fill="none" stroke="rgba(91,192,190,.7)" strokeWidth="1.5"/></svg>))}
        <div className="mono" style={{position:'absolute', left:14, bottom:10, fontSize:10, color:'rgba(255,255,255,.45)'}}>IR · 60Hz</div>
        <div className="mono" style={{position:'absolute', right:14, bottom:10, fontSize:10, color:'rgba(91,192,190,.7)'}}>{running ? '● ACQUIRING' : '○ STANDBY'}</div>
        <div style={{position:'absolute', left: `${target.x}%`, top: `${target.y}%`, transform:'translate(-50%, -50%)', transition: running ? 'left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1)' : 'none', opacity: running ? 1 : .45, pointerEvents:'none'}}>
          <Reticle size={acquiring ? 80 : 64}/>
          {acquiring && (<div style={{position:'absolute', inset:-6, border:'2px solid #5BC0BE', borderRadius:'50%', animation:'lock .35s ease-out forwards'}}/>)}
        </div>
        {pings.map(p=>(<div key={p.id} style={{position:'absolute', left:`${p.x}%`, top:`${p.y}%`, width:80, height:80, marginLeft:-40, marginTop:-40, borderRadius:'50%', border:'2px solid #5BC0BE', animation:'ping .8s ease-out forwards', pointerEvents:'none'}}/>))}
        {!running && time>0 && (<div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:6, pointerEvents:'none'}}><div className="mono" style={{fontSize:11, color:'rgba(91,192,190,.85)', letterSpacing:'.18em'}}>HOVER ON TARGET TO LOCK</div><div className="h-display" style={{fontSize:22, color:'rgba(255,255,255,.72)'}}>Press start.</div></div>)}
        {!running && time<=0 && (<div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:6, pointerEvents:'none'}}><div className="mono" style={{fontSize:11, color:'#5BC0BE', letterSpacing:'.18em'}}>SESSION COMPLETE</div><div className="h-display" style={{fontSize:42}}>{score} <span style={{color:'rgba(255,255,255,.45)', fontSize:18}}>locks</span></div><div className="mono" style={{fontSize:11, color:'rgba(255,255,255,.5)'}}>{score>=best ? 'NEW BEST' : `BEST · ${best}`}</div></div>)}
      </div>
    </div>
  );
}

function CustomCursor(){
  const dotRef = useRef(null), ringRef = useRef(null);
  useEffect(()=>{
    let tx=0, ty=0, dx=0, dy=0, rx=0, ry=0;
    const onMove = (e)=>{ tx = e.clientX; ty = e.clientY; };
    const onDown = ()=>{ ringRef.current?.classList.add('hover'); };
    const onUp = ()=>{ ringRef.current?.classList.remove('hover'); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    let raf;
    const tick=()=>{
      dx += (tx - dx)*.5; dy += (ty - dy)*.5;
      rx += (tx - rx)*.18; ry += (ty - ry)*.18;
      if(dotRef.current) dotRef.current.style.transform = `translate3d(${dx-3}px, ${dy-3}px, 0)`;
      if(ringRef.current) ringRef.current.style.transform = `translate3d(${rx-17}px, ${ry-17}px, 0)`;
      const want = document.body.dataset.cursor === 'hover';
      const has = ringRef.current?.classList.contains('hover');
      if(want && !has) ringRef.current?.classList.add('hover');
      else if(!want && has) ringRef.current?.classList.remove('hover');
      raf = requestAnimationFrame(tick);
    };
    tick();
    return ()=>{ window.removeEventListener('mousemove', onMove); window.removeEventListener('mousedown', onDown); window.removeEventListener('mouseup', onUp); cancelAnimationFrame(raf); };
  },[]);
  useEffect(()=>{ dotRef.current = document.getElementById('cursor-dot'); ringRef.current = document.getElementById('cursor-ring'); },[]);
  return null;
}

function TopNav(){
  const items = [{id:'hero', label:'home'},{id:'about', label:'about'},{id:'projects', label:'work'},{id:'experience', label:'cv'},{id:'credentials', label:'awards'},{id:'playground', label:'play'}];
  const [active, setActive] = useState('hero');
  useEffect(()=>{
    const io = new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); }); }, {rootMargin:'-40% 0px -55% 0px', threshold:0});
    items.forEach(it=>{ const el = document.getElementById(it.id); if(el) io.observe(el); });
    return ()=> io.disconnect();
  },[]);
  return (
    <nav className="topnav">
      {items.map(it=>(<button key={it.id} className={active===it.id?'active':''} onMouseEnter={()=>document.body.dataset.cursor='hover'} onMouseLeave={()=>document.body.dataset.cursor=''} onClick={()=> document.getElementById(it.id)?.scrollIntoView({behavior:'smooth', block:'start'})}>{it.label}</button>))}
    </nav>
  );
}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tom Cheng. Software engineer building mixed reality and AI systems.">
<style>
/* base reset */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Tom Cheng Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark toy desk fills the screen; each object opens a light paper page that slides up over it. */
:root{
  color-scheme:dark;
  --night:#12141a;          /* the room */
  --night-ink:#eef0f2;
  --night-muted:#9aa2ac;
  --amber:#f2a33a;          /* lamp light, the one accent */
  --paper:#f3f4f0;          /* reading pages */
  --card:#ffffff;
  --ink:#1b1f24;
  --ink-muted:#5c656e;
  --amber-deep:#a85f06;     /* amber that reads on paper */
  --rule:#dcdfd8;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--night-ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.brand{position:absolute;left:18px;top:14px;pointer-events:none;max-width:calc(100% - 130px)}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.brand span{display:block;font-size:13px;color:var(--night-muted);margin-top:2px}
#btn-index{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer}
#btn-index:hover{border-color:var(--amber);color:var(--amber)}
.hint{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--night-muted);pointer-events:none}

#labels{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
.label{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;background:rgba(18,20,26,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s,color .2s,background .2s}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.label.hot,.label:hover{border-color:var(--amber);color:var(--amber);background:rgba(18,20,26,.92)}

/* ---- paper pages ---- */
#page{position:absolute;inset:0;color-scheme:light;background:var(--paper);color:var(--ink);overflow-y:auto;overflow-x:hidden;transform:translateY(103%);transition:transform .6s cubic-bezier(.2,.8,.2,1);border-radius:18px 18px 0 0;-webkit-overflow-scrolling:touch}
#page.in{transform:none;border-radius:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:rgba(243,244,240,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.bar button{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer}
.bar button:hover{background:#000}
.bar span{font-family:var(--mono);font-size:12px;color:var(--ink-muted);text-align:right}
.sheet{max-width:860px;margin:0 auto;padding-block:44px 72px;padding-inline:22px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-deep);margin:0}
.sheet h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,68px);line-height:.98;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:clamp(18px,2.4vw,21px);line-height:1.45;max-width:38em;margin:0;color:var(--ink)}
.draft{font-family:var(--mono);font-size:12px;color:var(--ink-muted);border:1px dashed #c4c8c0;border-radius:8px;padding:8px 12px;margin:0;align-self:flex-start}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,30px);line-height:1.1;margin:0;text-wrap:balance}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-muted);margin:0}
.card p{margin:0;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border-radius:999px;padding:3px 11px;border:1px solid var(--rule);color:var(--ink-muted)}
.chips.stat li{background:#fdf1dc;border-color:#f0d6a4;color:#6e4204;font-weight:600}
.h2{font-family:var(--display);font-weight:700;font-size:24px;margin:14px 0 0}
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.rows li{display:grid;grid-template-columns:8.5em 1fr;gap:4px 18px;padding:14px 0;border-bottom:1px solid var(--rule)}
.rows .when{font-family:var(--mono);font-size:12.5px;color:var(--ink-muted);padding-top:3px;font-variant-numeric:tabular-nums}
.rows b{font-weight:600}
.rows small{display:block;font-size:14.5px;color:var(--ink-muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.grid img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.1)}
.grid figure{margin:0;transition:transform .25s}
.grid figure:nth-child(odd){transform:rotate(-1.2deg)}
.grid figure:nth-child(even){transform:rotate(1deg)}
.grid figure:hover{transform:rotate(0) scale(1.03)}
.slot{border:1.5px dashed #c4c8c0;border-radius:16px;padding:24px;color:var(--ink-muted);min-height:110px;display:flex;align-items:center}
.empty{border:1.5px dashed #c4c8c0;border-radius:16px;padding:40px 24px;text-align:center;color:var(--ink-muted)}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.contact code{font-family:var(--mono);font-size:15px;user-select:all;overflow-wrap:anywhere}
.contact button,.contact a{font-size:14px;border:1px solid var(--ink);border-radius:999px;padding:6px 14px;background:none;color:var(--ink);text-decoration:none;cursor:pointer}
.contact button:hover,.contact a:hover{background:var(--ink);color:var(--paper)}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.toc button{text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.toc button:hover{border-color:var(--amber-deep)}
.toc b{font-family:var(--display);font-size:21px}
.toc span{font-size:14.5px;color:var(--ink-muted)}
.next{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-top:22px;margin-top:18px}
.next button{background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:20px;cursor:pointer;color:var(--ink)}
.next button:hover{color:var(--amber-deep)}
.next small{display:block;font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em}

@media (max-width:640px){
  .brand b{font-size:21px}.brand span{font-size:12.5px}
  .label{font-size:12px;padding:4px 10px 4px 8px}
  .rows li{grid-template-columns:1fr;gap:2px}
  .card{padding:20px}
  .sheet{padding-block:30px 60px}
}
@media (prefers-reduced-motion:reduce){#page{transition-duration:.01s}.grid figure{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" tabindex="-1" aria-label="A desk with objects. Each labelled object opens a section of the site."></canvas>
  <div id="desk-ui">
    <nav id="labels" aria-label="Sections"></nav>
    <header class="brand"><b>Tom Cheng</b><span>Software engineer building mixed reality and AI systems</span></header>
    <button id="btn-index" type="button">Index</button>
    <p class="hint" id="hint">Everything on the desk can be picked up. The labelled things open.</p>
  </div>
  <main id="page" hidden>
    <div class="bar"><button id="back" type="button">← Back to the desk</button><span id="crumb"></span></div>
    <div class="sheet" id="page-body"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= content (in the real site: one file per item) ================= */
const WORK=[
 {title:'AccuHip & AccuKnee',meta:'Lead Software Engineer · AccuOrtho · Sept 2022 to present',
  body:'Mixed reality navigation for hip and knee replacement. The surgeon wears a headset and sees guidance on the patient during the operation. I lead the software, and I designed the modules for the operative workflow, the interface, infrared tracking and 3D visualisation.',
  stats:['Lead engineer since 2022'],tags:['Unity','MRTK','HoloLens 2','Python','Figma','ISO / QMS']},
 {title:'Meeting Intelligence + VRL Agent',meta:'AI Engineer Intern · Trend Micro · July to Sept 2025',
  body:'An internal platform that summarises meetings while they happen, after they end, and across a whole series. I also built an agent for the AI SIEM team that writes Vector Remap Language scripts, turning raw third-party logs into structured, searchable fields.',
  stats:['Adopted by 300+ employees'],tags:['LangChain','LangGraph','Chrome extension','Postgres']},
 {title:'Competitor Analysis CMS',meta:'Backend Engineer Intern · International Games System · Apr 2022 to Mar 2023',
  body:'The backend of a content system the company uses to track competitors. I redesigned the database around caching, which cut the time queries take by three quarters.',
  stats:['Used daily by 1,000+ employees','75% less query time'],tags:['Node.js','MongoDB','Redis','GCP','Docker','Jest']}
];
const PAPERS=[
 {when:'2023',t:'MAAIG: a multimodal approach to AI-generated instructions for sport',s:'Workshop on Intelligent Sports Technologies, ACM Multimedia Asia 2023. Written as a research assistant at IIS, Academia Sinica, on instruction generation for ice skating and boxing.'},
 {when:'MSc',t:'Computer vision in medicine (clinical imaging study)',s:'Journal of Imaging Informatics in Medicine. Working title here; replace with the paper’s full title and a link.'}
];
const AWARDS=[
 ['Nov 2025','From IP to IPO Program','Top 3'],
 ['Dec 2024','National Innovation Award',''],
 ['Dec 2024','Robotics Competition','1st of 16 teams'],
 ['Nov 2024','E.SUN AI Open Competition','2nd of 218'],
 ['2024 to 2026','MSc, National Taiwan University','Ranked 1st of 214, GPA 4.3 / 4.3'],
 ['2023','Valedictorian, NTUST','Ranked 1st of 107, GPA 4.24 / 4.3'],
 ['2019 to 2023','Phi Tau Phi Scholastic Honor','Academic Excellence Award, seven times']
];
const PLACES=[
 ['Taipei','Home','Where I studied at NTUST and NTU, and where I work.'],
 ['Singapore','Jan to May 2023','Exchange at the National University of Singapore, School of Computing.'],
 ['Toronto','Fall 2026','Graduate exchange at the University of Toronto.']
];
const EMAIL='bosszheng220@gmail.com';

const SECTIONS=[
 {key:'work',label:'Work',thing:'The laptop',title:'Work',blurb:'Three things I’ve built and shipped',
  lead:'I build software that people rely on while doing something else difficult: operating, running a meeting, watching a market.',
  html:()=>'<div class="stack">'+WORK.map(w=>`<article class="card"><h2>${esc(w.title)}</h2><p class="meta">${esc(w.meta)}</p><p>${esc(w.body)}</p><ul class="chips stat">${w.stats.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><ul class="chips">${w.tags.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></article>`).join('')+'</div>'},
 {key:'research',label:'Research',thing:'The stack of papers',title:'Research',blurb:'Papers and the lab I work in',
  lead:'My research is in computer vision and multimodal models, mostly applied to medicine and to human movement.',
  html:()=>`<ul class="rows">${PAPERS.map(p=>`<li><span class="when">${esc(p.when)}</span><span><b>${esc(p.t)}</b><small>${esc(p.s)}</small></span></li>`).join('')}</ul>
   <h2 class="h2">Where</h2><ul class="rows"><li><span class="when">2024 to 2026</span><span><b>Intelligent Robot Lab, National Taiwan University</b><small>MSc in Computer Science and Information Engineering, advised by Prof. Li-Chen Fu.</small></span></li><li><span class="when">2023</span><span><b>Institute of Information Science, Academia Sinica</b><small>Research assistant. Language models and workflows for generating sport instruction.</small></span></li></ul>`},
 {key:'achievements',label:'Achievements',thing:'The trophy',title:'Achievements',blurb:'Awards, rankings and honours',
  lead:'A short list, newest first.',
  html:()=>`<ul class="rows">${AWARDS.map(a=>`<li><span class="when">${esc(a[0])}</span><span><b>${esc(a[1])}</b>${a[2]?`<small>${esc(a[2])}</small>`:''}</span></li>`).join('')}</ul>`},
 {key:'side',label:'Side projects',thing:'The controller',title:'Side projects',blurb:'Things built for the fun of it',
  lead:'Smaller things, made out of curiosity.',
  html:()=>`<div class="stack"><article class="card"><h2>Haptic navigation sock</h2><p class="meta">Example entry · confirm or replace</p><p>A sock with small vibration motors that tells you which way to walk, so you can follow directions without looking at a screen.</p><ul class="chips"><li>Arduino</li><li>Bluetooth LE</li></ul></article><div class="slot">Your next project goes here. Game development and Solidity both appear on your CV and would fit.</div><div class="slot">And another.</div></div>`},
 {key:'photos',label:'Photographs',thing:'The prints',title:'Photographs',blurb:'Pictures from the places below',
  lead:'Black and white, mostly streets, mostly one person in a lot of space.',
  html:()=>`<div class="grid">${photoURLs().map((u,i)=>`<figure><img src="${u}" alt="Placeholder photograph ${i+1}" width="512" height="340"></figure>`).join('')}</div><p class="draft">These six are placeholders drawn in code. Your photographs replace them.</p>`},
 {key:'travel',label:'Travel',thing:'The globe',title:'Travel',blurb:'Where I’ve lived and studied',
  lead:'Three cities so far have been home for a while. The pins on the globe mark them.',
  html:()=>`<ul class="rows">${PLACES.map(p=>`<li><span class="when">${esc(p[1])}</span><span><b>${esc(p[0])}</b><small>${esc(p[2])}</small></span></li>`).join('')}</ul>`},
 {key:'writing',label:'Writing',thing:'The notebook',title:'Writing',blurb:'Notes, when there are some',
  lead:'Notes on what I’m building and learning.',
  html:()=>`<div class="empty">Nothing published yet. On the real site this section stays hidden until the first note exists.</div>`},
 {key:'about',label:'About',thing:'The nameplate',title:'Tom Cheng',blurb:'Who I am and how to reach me',
  lead:'I’m Tom (Wen-Hsiang Cheng), a software engineer from Taipei. I build mixed reality and AI systems: surgical navigation at AccuOrtho, and before that agents, language models and backends at Trend Micro, Academia Sinica and IGS.',
  html:()=>`<div class="contact"><code id="email">${EMAIL}</code><button type="button" id="copy">Copy</button><a href="https://www.linkedin.com/in/chengwenhsiang" target="_blank" rel="noopener">LinkedIn</a></div>
   <h2 class="h2">Education</h2><ul class="rows">
   <li><span class="when">2024 to 2026</span><span><b>National Taiwan University</b><small>MSc, Computer Science and Information Engineering. Exchange at the University of Toronto, fall 2026.</small></span></li>
   <li><span class="when">2019 to 2023</span><span><b>National Taiwan University of Science and Technology</b><small>BSc, Computer Science and Information Engineering. Valedictorian. Exchange at the National University of Singapore.</small></span></li></ul>
   <h2 class="h2">I work in</h2><ul class="chips"><li>Python</li><li>C#</li><li>C / C++</li><li>TypeScript</li><li>Solidity</li><li>Unity</li><li>Docker</li><li>Google Cloud</li></ul>
   <h2 class="h2">I speak</h2><ul class="chips"><li>Mandarin</li><li>English</li><li>Spanish, conversationally</li><li>Taiwanese, a little</li></ul>
   <h2 class="h2">Away from the keyboard</h2><p style="margin:0;max-width:62ch">Dodgeball, making games, and photographs. The ball on the desk is not decoration.</p>`}
];
const SEC={};SECTIONS.forEach(s=>SEC[s.key]=s);

/* ================= pages ================= */
const page=$('#page'),pageBody=$('#page-body'),deskUI=$('#desk-ui');
let openKey=null,closeTimer=0,webgl=true;
function renderPage(key){
  if(key==='index'){
    $('#crumb').textContent='Everything, without the desk';
    pageBody.innerHTML=`<p class="eyebrow">Index</p><h1>Tom Cheng</h1><p class="lead">Software engineer building mixed reality and AI systems. Every section of the site, as a plain list.</p><div class="toc">${SECTIONS.map(s=>`<button type="button" data-go="${s.key}"><b>${esc(s.label)}</b><span>${esc(s.blurb)}</span></button>`).join('')}</div>`;
    return;
  }
  const s=SEC[key],i=SECTIONS.indexOf(s),p=SECTIONS[(i+SECTIONS.length-1)%SECTIONS.length],n=SECTIONS[(i+1)%SECTIONS.length];
  $('#crumb').textContent=s.thing;
  pageBody.innerHTML=`<p class="eyebrow">${esc(s.thing)}</p><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p>${s.html()}<p class="draft">Draft text, written from your CV.</p><div class="next"><button type="button" data-go="${p.key}"><small>Previous</small>${esc(p.label)}</button><button type="button" data-go="${n.key}" style="text-align:right"><small>Next</small>${esc(n.label)}</button></div>`;
}
function openPage(key,instant){
  if(!SEC[key]&&key!=='index')return;
  clearTimeout(closeTimer);openKey=key;renderPage(key);
  page.hidden=false;page.scrollTop=0;deskUI.inert=true;
  if(instant){page.style.transition='none';page.classList.add('in');void page.offsetWidth;page.style.transition='';}
  else{void page.offsetWidth;page.classList.add('in');}
  try{history.replaceState(null,'','#'+key);}catch(e){}
  $('#back').focus({preventScroll:true});
}
function closePage(){
  if(!openKey||!webgl)return;const was=openKey;openKey=null;
  page.classList.remove('in');deskUI.inert=false;
  closeTimer=setTimeout(()=>{page.hidden=true;},reduce?30:620);
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  const b=document.querySelector('.label[data-key="'+was+'"]')||$('#btn-index');b.focus({preventScroll:true});
}
$('#back').addEventListener('click',closePage);
$('#btn-index').addEventListener('click',()=>openPage('index'));
addEventListener('keydown',e=>{if(e.key==='Escape')closePage();});
pageBody.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){openPage(go.dataset.go,true);return;}
  if(e.target.id==='copy'){const b=e.target,done=()=>{b.textContent='Copied';setTimeout(()=>{b.textContent='Copy';},1600);};
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('#email'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected';};
    try{navigator.clipboard.writeText(EMAIL).then(done,sel);}catch(_){sel();}}
});

function noWebGL(){webgl=false;$('#back').hidden=true;$('#stage').hidden=true;openPage('index',true);}
if(typeof THREE==='undefined'||!THREE.EffectComposer||!THREE.RoundedBoxGeometry){noWebGL();return;}
const canvas=$('#stage');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});}catch(e){noWebGL();return;}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

/* ================= scene basics ================= */
const V3=THREE.Vector3;
const col=h=>new THREE.Color(h).convertSRGBToLinear();
const scene=new THREE.Scene();scene.background=col('#101217');
const FOV=30,TAN=Math.tan(FOV*Math.PI/360);
const camera=new THREE.PerspectiveCamera(FOV,1,1,70);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(),.04).texture;
const mats={};
const M=(hex,o)=>{const k=hex+JSON.stringify(o||{});return mats[k]||(mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:col(hex),roughness:.8,metalness:0,envMapIntensity:.22},o||{})));};
const rbox=(w,h,d,r,m)=>new THREE.Mesh(new THREE.RoundedBoxGeometry(w,h,d,4,r),m);
const cyl=(rt,rb,h,m,seg)=>new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||32),m);
const sph=(r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,32,24),m);
function limb(a,b,r,m){const d=b.clone().sub(a),me=new THREE.Mesh(new THREE.CapsuleGeometry(r,d.length(),6,16),m);me.position.copy(a).addScaledVector(d,.5);me.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());return me;}

  const cupm=new THREE.Mesh(new THREE.LatheGeometry([[0,0],[.07,0],[.08,.008],[.083,.17],[.073,.17],[.07,.016],[0,.016]].map(p=>new THREE.Vector2(p[0],p[1])),40),m);w.add(cupm);
  const h=new THREE.Mesh(new THREE.TorusGeometry(.045,.012,10,24,Math.PI),m);h.rotation.z=-Math.PI/2;h.position.set(.082,.09,0);w.add(h);
  const cof=new THREE.Mesh(new THREE.CircleGeometry(.072,32),M('#2a170c',{roughness:.2}));cof.rotation.x=-Math.PI/2;cof.position.y=.145;cof.userData.flat=true;w.add(cof);
  const pud=new THREE.Mesh(new THREE.CircleGeometry(.2,40),M('#2a170c',{roughness:.15,transparent:true,opacity:.9}));pud.rotation.x=-Math.PI/2;pud.position.set(-.26,.003,.02);pud.scale.set(0,0,1);pud.userData.flat=true;g.add(pud);
  const sm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.2,depthWrite:false});
  const steam=[0,1,2,3].map(i=>{const s=sph(.022,sm.clone());s.userData.flat=true;s.userData.p=i/4;g.add(s);return s;});
  o.tall=.24;
  return(dt,t)=>{if(mug.tipping){mug.tip+=dt;if(mug.tip>2.6){mug.tipping=false;mug.tip=0;}}
    const u=mug.tip,a=u<.35?u/.35:u<2?1:Math.max(0,1-(u-2)/.6),e=a*a*(3-2*a);
    w.rotation.z=e*1.5;w.position.x=-e*.02;w.position.y=e*.07;cof.visible=e<.3;const ps=u<.25?0:u<2.1?Math.min(1,(u-.25)/.5):Math.max(0,1-(u-2.1)/.5);pud.scale.set(ps,ps*.8,1);
    steam.forEach(s=>{s.userData.p=(s.userData.p+dt*.28)%1;const p=s.userData.p;s.position.set(Math.sin(t*1.3+p*9)*.02,.19+p*.26,Math.cos(t+p*7)*.015);s.scale.setScalar(.6+p*1.4);s.material.opacity=(reduce||e>.2)?0:.22*Math.sin(p*Math.PI);});};});
add('ball','ball',.13,(g,o)=>{const b=new THREE.Mesh(new THREE.SphereGeometry(.13,40,28),M('#ffffff',{map:tex(ballCanvas()),roughness:.7}));b.position.y=.13;g.add(b);o.parts.b=b;o.tall=.3;b.rotation.z=.5;});
const ball=byKey.ball;

/* ---- desk ---- */
let deskG=null,DW=5,DD=3,portrait=false;
function buildDesk(){
  if(deskG){scene.remove(deskG);deskG.traverse(m=>{if(m.geometry)m.geometry.dispose();});}
  deskG=new THREE.Group();
  const slab=rbox(DW,.2,DD,.07,M('#c79d70',{roughness:.7}));slab.position.y=-.1;slab.receiveShadow=true;slab.castShadow=true;deskG.add(slab);
  const mat=rbox(DW-.36,.012,DD-.36,.006,M('#1f3b45',{roughness:.95}));mat.position.y=.006;mat.receiveShadow=true;deskG.add(mat);
  scene.add(deskG);
}

/* ---- lights ---- */
const key=new THREE.DirectionalLight(col('#ffe2bd'),1.3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0006;key.shadow.normalBias=.012;key.shadow.radius=5;scene.add(key,key.target);
const hemi=new THREE.HemisphereLight(col('#a9c2ea'),col('#2b241d'),.5);scene.add(hemi);
const rim=new THREE.DirectionalLight(col('#8fb2ff'),.35);rim.position.set(4,3,-5);scene.add(rim);
const WARM=col('#ffe2bd'),COOL=col('#8eaaf0');let lampMix=1;

/* ---- post ---- */
const rt=new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:renderer.capabilities.isWebGL2?4:0});
const composer=new THREE.EffectComposer(renderer,rt);composer.addPass(new THREE.RenderPass(scene,camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(4,4),.22,.4,1.35));
const finalPass=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0},exposure:{value:1.08}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;uniform float time,exposure;varying vec2 vUv;vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){vec3 c=texture2D(tDiffuse,vUv).rgb*exposure;c=aces(c);c=pow(c,vec3(1./2.2));vec2 d=vUv-.5;c*=1.-.75*dot(d,d);c+=(h(vUv*vec2(1920.,1080.)+fract(time)*60.)-.5)*.016;gl_FragColor=vec4(c,1.);}'});
composer.addPass(finalPass);

/* ================= layout and camera ================= */
let W=1,H=1,aspect=1,prCap=2,perfN=0,perfT=0;
const LAND=[['achievements','work','travel','about'],['research','photos','side','writing']];
const PORT=[['achievements','work'],['travel','about'],['research','photos'],['side','writing']];
const base={target:new V3(),dist:10,elev:.86,az:0},cur={target:new V3(),dist:10,elev:.86,az:0};
const tmp=new V3(),tmp2=new V3();
function place(c,dx,dy){const e=Math.min(1.5,c.elev+dy),a=c.az+dx;camera.position.set(c.target.x+c.dist*Math.cos(e)*Math.sin(a),c.target.y+c.dist*Math.sin(e),c.target.z+c.dist*Math.cos(e)*Math.cos(a));camera.lookAt(c.target);camera.updateMatrixWorld();}
function layout(snap){
  const was=portrait;portrait=aspect<1;const grid=portrait?PORT:LAND,rows=grid.length,cols=grid[0].length,CW=1.08,CD=portrait?1.24:1.14;
  const nw=cols*CW+.86,nd=rows*CD+.62;
  if(!deskG||nw!==DW||nd!==DD){DW=nw;DD=nd;buildDesk();}
  grid.forEach((row,r)=>row.forEach((k,c)=>{byKey[k].home.set((c-(cols-1)/2)*CW,0,(r-(rows-1)/2)*CD-.04);}));
  byKey.lamp.home.set(-DW/2+.36,0,-DD/2+.34);byKey.lamp.group.rotation.y=portrait?.15:.05;
  byKey.mug.home.set(DW/2-.36,0,-DD/2+.36);
  if(snap||was!==portrait){objs.forEach(o=>{if(o!==ball){o.pos.copy(o.home);o.vel.set(0,0,0);}});ball.pos.set(DW/2-.42,0,DD/2-.36);ball.vel.set(0,0,0);}
  key.position.set(-3.2,7.5,3.6);key.target.position.set(0,0,0);{const r=Math.hypot(DW,DD)/2+.5,sc=key.shadow.camera;sc.left=-r;sc.right=r;sc.top=r;sc.bottom=-r;sc.near=1;sc.far=20;sc.updateProjectionMatrix();}
  // fit the whole desk between the header and the hint
  base.elev=portrait?1.06:.86;base.az=0;base.target.set(0,0,0);
  const pts=[];[-1,1].forEach(sx=>[-1,1].forEach(sz=>{pts.push(new V3(sx*DW/2,0,sz*DD/2),new V3(sx*(DW/2-.3),.5,sz*(DD/2-.3)));}));pts.push(new V3(-DW/2+.7,1.0,-DD/2+.6));
  const top=1-2*(78/H),bot=-1+2*(58/H),mx=1-2*(10/W);
  const bounds=()=>{let a=9,b=-9,c=9,d=-9;pts.forEach(p=>{tmp.copy(p).project(camera);a=Math.min(a,tmp.x);b=Math.max(b,tmp.x);c=Math.min(c,tmp.y);d=Math.max(d,tmp.y);});return[a,b,c,d];};
  for(let it=0;it<4;it++){let lo=1,hi=80;for(let i=0;i<26;i++){const mid=(lo+hi)/2;base.dist=mid;place(base,0,0);const q=bounds();if(q[1]-q[0]<=2*mx&&q[3]-q[2]<=top-bot)hi=mid;else lo=mid;}
    base.dist=hi;place(base,0,0);const q=bounds();tmp.setFromMatrixColumn(camera.matrixWorld,1);tmp2.setFromMatrixColumn(camera.matrixWorld,0);
    base.target.addScaledVector(tmp,((q[2]+q[3])/2-(top+bot)/2)*base.dist*TAN).addScaledVector(tmp2,((q[0]+q[1])/2)*base.dist*TAN*aspect);}
}
function resize(){W=canvas.clientWidth||innerWidth;H=canvas.clientHeight||innerHeight;aspect=W/H;const pr=Math.min(devicePixelRatio||1,prCap);
  renderer.setPixelRatio(pr);renderer.setSize(W,H,false);composer.setSize(Math.round(W*pr),Math.round(H*pr));camera.aspect=aspect;camera.updateProjectionMatrix();layout(false);}

/* ================= labels ================= */
const labelsEl=$('#labels');let labelHover=null;
const labels=SECTIONS.map(s=>{const b=document.createElement('button');b.type='button';b.className='label';b.dataset.key=s.key;b.textContent=s.label;const o=byKey[s.key];
  b.addEventListener('click',()=>activate(o));b.addEventListener('mouseenter',()=>{labelHover=o;});b.addEventListener('mouseleave',()=>{if(labelHover===o)labelHover=null;});
  b.addEventListener('focus',()=>{labelHover=o;});b.addEventListener('blur',()=>{if(labelHover===o)labelHover=null;});labelsEl.appendChild(b);return{b,o};});
// keyboard order follows reading order, not desk position
function activate(o){
  if(o.kind==='section'){if(openKey)return;o.yv=reduce?0:1.5;const k=o.key;setTimeout(()=>{if(!openKey)openPage(k);},reduce?0:240);}
  else if(o.kind==='lamp'){lampState.on=!lampState.on;o.yv=reduce?0:.9;}
  else if(o.kind==='mug'){if(!mug.tipping&&!reduce){mug.tipping=true;mug.tip=0;}}
  else if(o.kind==='ball'){const a=rnd()*6.283;ball.vel.set(Math.cos(a)*2.4,0,Math.sin(a)*2.4);ball.yv=1.8;}
}

/* ================= pointer ================= */
const ray=new THREE.Raycaster(),nd=new THREE.Vector2(),plane=new THREE.Plane(new V3(0,1,0),-SURF);
let hover=null,down=null,drag=null;const ptr={x:0,y:0,sx:0,sy:0};
function setRay(e){const r=canvas.getBoundingClientRect();nd.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(nd,camera);}
function pick(e){setRay(e);const h=ray.intersectObjects(objs.map(o=>o.hit),false);return h.length?h[0].object.userData.o:null;}
canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();if(e.pointerType==='mouse'){ptr.x=((e.clientX-r.left)/r.width)*2-1;ptr.y=((e.clientY-r.top)/r.height)*2-1;}
  if(down&&!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7){down.moved=true;if(down.o&&down.o.kind!=='lamp'){drag=down.o;drag.target.copy(drag.pos);}}
  if(drag){setRay(e);if(ray.ray.intersectPlane(plane,tmp)){drag.target.set(Math.max(-DW/2+.2,Math.min(DW/2-.2,tmp.x)),0,Math.max(-DD/2+.2,Math.min(DD/2-.2,tmp.z)));}}
  else if(!down){hover=pick(e);}
  canvas.style.cursor=drag?'grabbing':(hover?(hover.kind==='lamp'?'pointer':'grab'):'');
});
canvas.addEventListener('pointerdown',e=>{if(openKey)return;const o=pick(e);down={o,x:e.clientX,y:e.clientY,moved:false};hover=o;try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
function release(e,cancel){const d=down,g=drag;down=null;drag=null;if(!d)return;
  if(g){if(g===ball){const s=Math.min(1,7/Math.max(.001,g.vel.length()));g.vel.multiplyScalar(s);}}
  else if(!cancel&&!d.moved&&d.o)activate(d.o);
  if(e.pointerType!=='mouse')hover=null;canvas.style.cursor='';}
canvas.addEventListener('pointerup',e=>release(e,false));
canvas.addEventListener('pointercancel',e=>release(e,true));
canvas.addEventListener('pointerleave',()=>{if(!down){hover=null;ptr.x=0;ptr.y=0;}});

/* ================= frame ================= */
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-(reduce?60:k)*dt));
let last=performance.now(),time=0;const axis=new V3();
function tick(dt,draw){
  time+=dt;finalPass.uniforms.time.value=time;
  // lamp mood
  lampMix=damp(lampMix,lampState.on?1:0,6,dt);key.intensity=.4+lampMix*.95;key.color.copy(COOL).lerp(WARM,lampMix);hemi.intensity=.56-lampMix*.16;

  objs.forEach(o=>{
    const active=(hover===o||drag===o||labelHover===o||(openKey===o.key));
    o.h=damp(o.h,active?1:0,10,dt);
    // intro drop and hops
    if(o.delay>0)o.delay-=dt;else if(o.y>0||o.yv!==0){o.yv-=9.5*dt;o.y+=o.yv*dt;if(o.y<=0){o.y=0;o.yv=Math.abs(o.yv)>.5?-o.yv*.32:0;}}
    const px=o.pos.x,pz=o.pos.z;
    if(drag===o){o.pos.x=damp(o.pos.x,o.target.x,22,dt);o.pos.z=damp(o.pos.z,o.target.z,22,dt);if(dt>0)o.vel.set((o.pos.x-px)/dt,0,(o.pos.z-pz)/dt);}
    else if(o!==ball){const ax=-110*(o.pos.x-o.home.x)-15*o.vel.x,az=-110*(o.pos.z-o.home.z)-15*o.vel.z;o.vel.x+=ax*dt;o.vel.z+=az*dt;o.pos.x+=o.vel.x*dt;o.pos.z+=o.vel.z*dt;}
    o.lift=damp(o.lift,drag===o?.16:0,14,dt);
    if(o!==ball){o.body.rotation.z=damp(o.body.rotation.z,Math.max(-.35,Math.min(.35,-o.vel.x*.07)),12,dt);o.body.rotation.x=damp(o.body.rotation.x,Math.max(-.35,Math.min(.35,o.vel.z*.07)),12,dt);}
    o.update(dt,time);
  });
  // ball
  if(drag!==ball){const b=ball,f=Math.exp(-1.1*dt);b.vel.x*=f;b.vel.z*=f;if(b.vel.lengthSq()<.0004)b.vel.set(0,0,0);b.pos.x+=b.vel.x*dt;b.pos.z+=b.vel.z*dt;
    const lx=DW/2-.2,lz=DD/2-.2;if(b.pos.x>lx){b.pos.x=lx;b.vel.x=-Math.abs(b.vel.x)*.6;}if(b.pos.x<-lx){b.pos.x=-lx;b.vel.x=Math.abs(b.vel.x)*.6;}if(b.pos.z>lz){b.pos.z=lz;b.vel.z=-Math.abs(b.vel.z)*.6;}if(b.pos.z<-lz){b.pos.z=-lz;b.vel.z=Math.abs(b.vel.z)*.6;}}
  objs.forEach(o=>{if(o===ball)return;const dx=ball.pos.x-o.pos.x,dz=ball.pos.z-o.pos.z,d=Math.hypot(dx,dz),min=o.radius*.82+ball.radius;
    if(d<min&&d>1e-5&&drag!==ball){const nx=dx/d,nz=dz/d;ball.pos.x=o.pos.x+nx*min;ball.pos.z=o.pos.z+nz*min;const vn=(ball.vel.x-o.vel.x)*nx+(ball.vel.z-o.vel.z)*nz;
      if(vn<0){ball.vel.x-=1.6*vn*nx;ball.vel.z-=1.6*vn*nz;if(o.kind==='mug'&&vn<-1.3&&!mug.tipping&&!reduce){mug.tipping=true;mug.tip=0;}else if(vn<-1&&o.y===0&&!reduce)o.yv=Math.min(1.1,-vn*.35);}}});
  {const sp=ball.vel.length();if(sp>.001){axis.set(ball.vel.z,0,-ball.vel.x).normalize();ball.parts.b.rotateOnWorldAxis(axis,sp*dt/.13);}}
  objs.forEach(o=>{o.group.position.set(o.pos.x,SURF+o.y+o.lift+(o.kind==='section'?o.h*.045:0),o.pos.z);});

  // camera
  const tgt=openKey&&byKey[openKey]?byKey[openKey]:null;
  cur.target.x=damp(cur.target.x,tgt?tgt.pos.x:base.target.x,3.2,dt);cur.target.y=damp(cur.target.y,tgt?.18:base.target.y,3.2,dt);cur.target.z=damp(cur.target.z,tgt?tgt.pos.z:base.target.z,3.2,dt);
  cur.dist=damp(cur.dist,tgt?base.dist*.42:base.dist,3.2,dt);cur.elev=base.elev;cur.az=base.az;
  ptr.sx=damp(ptr.sx,ptr.x,4,dt);ptr.sy=damp(ptr.sy,ptr.y,4,dt);
  place(cur,reduce||drag?ptr.sx*0:ptr.sx*.05,reduce?0:-ptr.sy*.025);

  // labels
  if(!openKey){labels.forEach(l=>{tmp.set(l.o.home.x,SURF,l.o.home.z+.5).project(camera);l.b.style.left=((tmp.x*.5+.5)*W).toFixed(1)+'px';l.b.style.top=((-tmp.y*.5+.5)*H).toFixed(1)+'px';l.b.classList.toggle('hot',hover===l.o||drag===l.o);});}
  labelsEl.style.opacity=openKey?0:1;
  if(draw)composer.render();
}
function frame(now){requestAnimationFrame(frame);
  if(canvas.clientWidth!==W||canvas.clientHeight!==H)resize();
  const raw=(now-last)/1000,dt=Math.max(0,Math.min(raw,.05));last=now;
  if(prCap>1&&raw>0&&raw<.5){perfT+=raw;if(++perfN===80){const avg=perfT/80;if(avg>.05){prCap=Math.max(1,prCap-.5);resize();}else if(avg>.036&&prCap>1.5){prCap=1.5;resize();}perfN=0;perfT=0;}}
  if(page.classList.contains('in')&&openKey&&time>1&&page.getBoundingClientRect().top<1&&performance.now()-openedAt>900)return; // page fully covers the desk: skip drawing
  tick(dt,true);}
let openedAt=0;const _open=openPage;openPage=function(k,i){openedAt=performance.now();_open(k,i);};

W=canvas.clientWidth||innerWidth;H=canvas.clientHeight||innerHeight;aspect=W/H;
resize();layout(true);cur.target.copy(base.target);cur.dist=base.dist;cur.elev=base.elev;cur.az=base.az;
if(matchMedia('(pointer:coarse)').matches)$('#hint').textContent='Tap a label to open it. Drag anything.';
addEventListener('resize',resize);
const h0=(location.hash||'').slice(1);if(SEC[h0]||h0==='index')openPage(h0,true);
window.__desk={open:k=>openPage(k),close:closePage,state:()=>({openKey,lamp:lampState.on,portrait,ball:[+ball.pos.x.toFixed(2),+ball.pos.z.toFixed(2)],mug:mug.tipping}),
  screen:k=>{const o=byKey[k];tmp.set(o.pos.x,SURF+.08,o.pos.z).project(camera);return[(tmp.x*.5+.5)*W,(-tmp.y*.5+.5)*H];},
  step:n=>{for(let i=0;i<n;i++)tick(1/30,i===n-1);}};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
